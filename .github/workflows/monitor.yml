name: HIYO external monitoring
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: Send one connection-check email to the configured recipient
        type: boolean
        default: false
  push:
    branches: [master]
    paths: ['.upptimerc.yml', '.github/workflows/monitor.yml', 'scripts/**', 'package*.json', 'tests/**']
permissions: {}
concurrency:
  group: hiyo-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check public endpoints with Upptime
        uses: upptime/uptime-monitor@2e53e7570ad597ccf3f251d43502846a042165d2 # v1.44.0
        with:
          command: response-time
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
      - name: Record checks and deliver queued email
        env:
          SMTP_PASSWORD: ${{ secrets.HIYO_SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.HIYO_ALERT_EMAIL }}
          ALERT_TO: ${{ secrets.HIYO_ALERT_EMAIL }}
          TEST_EMAIL: ${{ inputs.test_email == true && 'true' || 'false' }}
        run: node scripts/snapshot.mjs
      - name: Save monitoring record
        if: always()
        run: |
          git config user.name 'HIYO Status'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history public/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update HIYO monitoring record [skip ci]'
            git push origin HEAD:master
          fi
